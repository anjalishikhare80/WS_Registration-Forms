
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 585px;
            min-height: 343px;
            display: flex;
            background: #101719;
            color: white;
        }

        .left-section {
            width: 50%;
            padding: 30px 20px;
            border-right: 1px solid #344047;
            text-align: center;
        }

        .logo {
            text-align: left;
            font-size: 36px;
            margin-bottom: 18px;
            background: linear-gradient(45deg, #ffb347, #ff3040, #c13584);
            color: transparent;
            background-clip: text;
        }

        .left-section h2 {
            font-size: 18px;
            line-height: 1.8;
            font-weight: normal;
        }

        .left-section h2 span {
            background: linear-gradient(45deg, #ffb347, #ff3040, #c13584);
            color: transparent;
            background-clip: text;
        }

        .photo-collage {
            margin-top: 35px;
            font-size: 43px;
        }

        .right-section {
            width: 50%;
            padding: 65px 23px 20px;
        }

        .right-section h3 {
            font-size: 10px;
            font-weight: normal;
            margin-bottom: 14px;
        }

        .right-section input {
            width: 100%;
            padding: 12px 9px;
            margin-bottom: 7px;
            background: transparent;
            border: 1px solid #344650;
            border-radius: 10px;
            color: white;
            font-size: 10px;
            outline: none;
        }

        .right-section input::placeholder {
            color: #aebac1;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            background: #214f91;
            border: none;
            border-radius: 20px;
            color: white;
            cursor: pointer;
        }

        .forgot-password {
            display: block;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 10px;
            margin-bottom: 40px;
        }

        .facebook-btn,
        .create-account {
            display: block;
            text-align: center;
            padding: 10px 4px;
            margin-top: 7px;
            border: 1px solid #344650;
            border-radius: 20px;
            color: white;
            text-decoration: none;
            font-size: 10px;
        }

        .facebook-btn i {
            color: #1688ff;
        }

        .create-account {
            color: #1688ff;
        }

        @media (max-width: 600px) {
            .login-container {
                width: 100%;
                flex-direction: column;
            }

            .left-section,
            .right-section {
                width: 100%;
            }

            .right-section {
                padding: 25px 20px;
            }

            .forgot-password {
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="left-section">
            <div class="logo">
                <i class="fa-brands fa-instagram"></i>
            </div>

            <h2>
                See everyday moments from<br>
                your <span>close friends.</span>
            </h2>

            <div class="photo-collage">📱 📸 💕</div>
        </section>

        <form class="right-section">
            <h3>Log into Instagram</h3>

            <input type="text"
                   placeholder="Mobile number, username or email"
                   aria-label="Username or email"
                   required>

            <input type="password"
                   placeholder="Password"
                   aria-label="Password"
                   required>

            <button type="submit" class="login-btn">Log in</button>

            <a href="#" class="forgot-password">Forgot password?</a>

            <a href="#" class="facebook-btn">
                <i class="fa-brands fa-facebook"></i>
                Log in with Facebook
            </a>

            <a href="#" class="create-account">Create new account</a>
        </form>

    </main>

</body>
</html>
