
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .registration-section {
            width: 585px;
            background: #4169f5;
            padding: 30px 20px;
        }

        .registration-form {
            max-width: 407px;
            margin: auto;
            padding: 16px;
            background: white;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .registration-form h2 {
            font-size: 15px;
            color: #333;
            margin-bottom: 17px;
        }

        .registration-form h3 {
            font-size: 10px;
            font-weight: normal;
            color: #555;
            margin: 14px 0 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px 10px;
        }

        .form-group label {
            display: block;
            font-size: 8px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            min-width: 0;
            height: 22px;
            padding: 4px 6px;
            border: 1px solid #d6d6d6;
            border-radius: 3px;
            font-size: 8px;
        }

        .next-btn {
            width: 114px;
            padding: 9px 12px;
            margin-top: 15px;
            background: #4169f5;
            border: none;
            border-radius: 2px;
            color: white;
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .next-btn span {
            margin-left: 5px;
        }

        @media (max-width: 500px) {
            .registration-section {
                width: 100%;
                padding: 15px 10px;
            }

            .form-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>

<body>

    <section class="registration-section">

        <form class="registration-form">

            <h2><u>Registration</u></h2>

            <h3>Personal Details</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input id="fullname" type="text"
                           placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input id="dob" type="text"
                           placeholder="Enter birth date" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email"
                           placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile number</label>
                    <input id="mobile" type="tel"
                           placeholder="Enter mobile number" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <input id="gender" type="text"
                           placeholder="Enter your gender" required>
                </div>

                <div class="form-group">
                    <label for="occupation">Occupation</label>
                    <input id="occupation" type="text"
                           placeholder="Enter occupation" required>
                </div>

            </div>

            <h3>Identity Details</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="idtype">ID Type</label>
                    <input id="idtype" type="text"
                           placeholder="Enter ID type" required>
                </div>

                <div class="form-group">
                    <label for="idnumber">ID Number</label>
                    <input id="idnumber" type="text"
                           placeholder="Enter ID number" required>
                </div>

                <div class="form-group">
                    <label for="authority">Issue Authority</label>
                    <input id="authority" type="text"
                           placeholder="Enter issue department" required>
                </div>

                <div class="form-group">
                    <label for="issuedate">Issue Date</label>
                    <input id="issuedate" type="text"
                           placeholder="Enter issue date" required>
                </div>

                <div class="form-group">
                    <label for="state">Issue State</label>
                    <input id="state" type="text"
                           placeholder="Enter issue state" required>
                </div>

                <div class="form-group">
                    <label for="expiry">Expiry Date</label>
                    <input id="expiry" type="text"
                           placeholder="Enter expiry date" required>
                </div>

            </div>

            <button type="submit" class="next-btn">
                Next <span>→</span>
            </button>

        </form>

    </section>

</body>
</html>
