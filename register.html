<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        *{
            box-sizing: border-box;

        }

        body{
            margin: 0;
            font-family: 'Times New Roman', Times, serif;
            background-color: white
        }

        label{
            display: block;
        }

        input{
            width: 100%;
        }

        .container{
            width: 500px;
            padding: 30px 68px 40px;
            margin: 32px auto; 
            border: 3px solid rgb(180, 177, 177);
        }
        .btn{
            width: 100%;
            cursor: pointer;
        }
        
    </style>
</head>
<body>
    <div class="container">
    <form action="#" method="post" class="form">

        <h2>Register</h2>
        <br>
        <p1>Kindly fill in this form to register</p1>
        <br>
        <br>

        <label for="username"><b>Username</b></label>
        <input type="text" id="username" name="username" placeholder="Enter Username" required>
        

        <label for="email"><b>Email</b></label>
        <input type="email" id="email" name="email" placeholder="Enter Email" required>
        
        <label for="password"><b>Password</b></label>
        <input type="password" id="password" name="password" placeholder="Enter Password" required>
        

        <label for="rpassword"><b>Repeat Password</b></label>
        <input type="password" id="rpassword" name="repeat password" placeholder="Repeat Password">
        
<br>
        <button type="submit" class="btn"> Register</button>

        <div class="login">

        <p>Already have an account?
            <a href="#">Log in.</a>
        </p>

        </div>

    </div>


    </form>
    
</body>
</html>
