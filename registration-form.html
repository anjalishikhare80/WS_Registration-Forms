
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registration-card {
            width: 235px;
            padding: 10px 30px 25px;
            background: #ededed;
            border: 1px solid #d5d5d5;
            border-radius: 6px;
            box-shadow: 0 1px 4px #bbb;
        }

        .registration-card h1 {
            text-align: center;
            font-size: 21px;
            font-weight: normal;
            color: #888;
            padding-bottom: 7px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 12px;
        }

        .choice-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            margin-bottom: 27px;
        }

        .choice {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #555;
        }

        .choice input {
            accent-color: #3d5bb5;
        }

        .input-row {
            display: flex;
            height: 27px;
            margin-bottom: 9px;
            box-shadow: 0 1px 3px #ccc;
        }

        .input-icon {
            width: 29px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #3e5cb5;
            color: white;
            font-size: 12px;
            border-radius: 2px 0 0 2px;
        }

        .input-row input {
            width: 100%;
            min-width: 0;
            border: 1px solid #ddd;
            padding: 7px;
            font-size: 11px;
            outline: none;
        }

        .gender-row {
            display: flex;
            justify-content: center;
            gap: 13px;
            margin: 17px 0 28px;
        }

        .gender-row .choice {
            gap: 5px;
        }

        .bottom-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .terms {
            color: #777;
            font-size: 8px;
            line-height: 1.5;
        }

        .terms a {
            color: #5367c7;
        }

        .register-btn {
            background: #3e5cb5;
            color: white;
            border: none;
            border-radius: 3px;
            padding: 8px 13px;
            font-size: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <form class="registration-card">

        <h1>Registration</h1>

        <div class="choice-row">
            <label class="choice">
                <input type="radio" name="account" value="personal" checked>
                Personal
            </label>

            <label class="choice">
                <input type="radio" name="account" value="company">
                Company
            </label>
        </div>

        <div class="input-row">
            <span class="input-icon">✉</span>
            <input type="email" placeholder="Email" required>
        </div>

        <div class="input-row">
            <span class="input-icon">♟</span>
            <input type="text" placeholder="Name" required>
        </div>

        <div class="input-row">
            <span class="input-icon">⛨</span>
            <input type="password" placeholder="Password" required>
        </div>

        <div class="gender-row">
            <label class="choice">
                <input type="radio" name="gender" value="male" checked>
                Male
            </label>

            <label class="choice">
                <input type="radio" name="gender" value="female">
                Female
            </label>
        </div>

        <div class="bottom-row">
            <p class="terms">
                By clicking Register, you agree<br>
                on our <a href="#">terms and<br>condition</a>
            </p>

            <button type="submit" class="register-btn">
                Register
            </button>
        </div>

    </form>

</body>
</html>
